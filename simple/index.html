<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLA Monitor</title>
<style>
  :root {
    --bg: #0f1318; --card: #171c23; --line: #242b35;
    --text: #e6e9ee; --muted: #8a94a3;
    --up: #3ddc84; --down: #ff5c5c; --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 28px; border-bottom: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .02em; }
  #meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  main { padding: 24px 28px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); padding: 16px 18px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .name { font-weight: 600; }
  .url { color: var(--muted); font-size: 12px; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .pill { font-size: 11px; font-weight: 700; letter-spacing: .08em;
          padding: 3px 9px; border-radius: 999px; }
  .pill.up   { background: rgba(61,220,132,.15); color: var(--up); }
  .pill.down { background: rgba(255,92,92,.15);  color: var(--down); }
  .pill.wait { background: rgba(138,148,163,.15); color: var(--muted); }
  .stats { display: flex; gap: 22px; margin: 14px 0 10px; font-variant-numeric: tabular-nums; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  svg { width: 100%; height: 48px; display: block; }
</style>
</head>
<body>
<header>
  <h1>SLA Monitor</h1>
  <div id="meta">waiting for first check…</div>
</header>
<main id="cards"></main>

<script>
  // Tiny latency chart. Each point is one check; null means that check failed
  // and is drawn as a red tick instead of a point.
  function sparkline(history) {
    const W = 300, H = 48, n = history.length;
    if (n < 2) return `<svg viewBox="0 0 ${W} ${H}"></svg>`;
    const valid = history.filter(v => v !== null);
    const max = Math.max(...valid, 1);
    const x = i => (i / (n - 1)) * W;
    const y = v => H - 4 - (v / max) * (H - 8);

    let d = "", pen = false, fails = "";
    history.forEach((v, i) => {
      if (v === null) {
        pen = false;
        fails += `<line x1="${x(i)}" y1="4" x2="${x(i)}" y2="${H - 4}" stroke="#ff5c5c" stroke-width="2"/>`;
        return;
      }
      d += (pen ? " L" : " M") + `${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${fails}` +
           `<path d="${d}" fill="none" stroke="#5aa9ff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }

  function render(targets) {
    document.getElementById("cards").innerHTML = targets.map(t => {
      const state = t.up === null ? "wait" : t.up ? "up" : "down";
      const label = t.up === null ? "WAITING" : t.up ? "UP" : "DOWN";
      return `
        <div class="card">
          <div class="top">
            <div>
              <div class="name">${t.name}</div>
              <div class="url">${t.url}</div>
            </div>
            <div class="pill ${state}">${label}</div>
          </div>
          <div class="stats">
            <div class="stat"><b>${t.latency_ms ?? "–"}</b><span>ms</span></div>
            <div class="stat"><b>${t.uptime_pct ?? "–"}%</b><span>uptime</span></div>
            <div class="stat"><b>${t.status ?? "–"}</b><span>status</span></div>
            <div class="stat"><b>${t.checks}</b><span>checks</span></div>
          </div>
          ${sparkline(t.history)}
        </div>`;
    }).join("");
  }

  // Ask the server for fresh numbers every 5 seconds and redraw.
  async function refresh() {
    const res = await fetch("/api/status");
    render(await res.json());
    document.getElementById("meta").textContent = "updated " + new Date().toLocaleTimeString();
  }
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
